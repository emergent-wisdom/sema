name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # re-publish server.json without cutting a new release

jobs:
  build-and-publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build
          mkdir -p ../src/sema/server/static
          cp -r build/client/* ../src/sema/server/static/

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: build-and-publish
    # Runs after PyPI on a release; runs alone on manual dispatch.
    if: always() && needs.build-and-publish.result != 'failure' && needs.build-and-publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # GitHub OIDC auth to the MCP Registry
    steps:
      - uses: actions/checkout@v4

      - name: Check server.json is in sync with pyproject
        run: python3 scripts/sync_release_metadata.py --check

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish server.json

