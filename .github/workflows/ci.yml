name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Lean safety proofs
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          leanchecker: false
          use-mathlib-cache: false
          lake-package-directory: verification/lean

      - name: Independently check Lean proof artifacts
        working-directory: verification/lean
        run: >-
          lake env leanchecker
          SemaVerification
          SemaVerification.Handshake
          SemaVerification.CanonicalEncoding

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[mcp]"
          pip install pytest

      - name: Run tests
        run: pytest

      - name: Validate vocabulary
        run: |
          sema search "coordination" > /dev/null
          sema resolve StateLock > /dev/null
          sema skeleton > /dev/null

      - name: Hash validity (blocking)
        if: matrix.python-version == '3.12'
        run: python -m sema.audit.hash_validity

      - name: Vocabulary JSON hashes are stable
        if: matrix.python-version == '3.12'
        run: |
          python scripts/rebuild_vocabulary.py || true
          if ! git diff --exit-code -- data/vocabulary/; then
            echo "::error::Vocabulary JSON hashes drift when rebuilt from source."
            echo "Run 'python scripts/rebuild_vocabulary.py --replace' locally and commit the"
            echo "updated JSON files + taxonomy.db."
            exit 1
          fi

      - name: Generated docs are up-to-date
        if: matrix.python-version == '3.12'
        run: |
          python scripts/vocabulary_merkle_root.py
          python -m sema.audit
          if ! git diff --exit-code -- docs/information/vocabulary_information.md docs/information/audit.md; then
            echo "::error::Generated docs are stale. Run locally and commit:"
            echo "  python scripts/vocabulary_merkle_root.py"
            echo "  python -m sema.audit"
            exit 1
          fi

      - name: Doc hash references are current
        if: matrix.python-version == '3.12'
        run: python scripts/update_doc_refs.py --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.11.12

      - name: Lint
        run: ruff check src/

      - name: Format check
        run: ruff format --check src/
