name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Lean safety proofs
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          leanchecker: false
          use-mathlib-cache: false
          lake-package-directory: verification/lean

      - name: Independently check Lean proof artifacts
        working-directory: verification/lean
        run: >-
          lake env leanchecker
          SemaVerification
          SemaVerification.Handshake
          SemaVerification.CanonicalEncoding

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[mcp]"
          pip install pytest

      - name: Run tests
        run: pytest

      - name: Validate vocabulary
        run: |
          sema search "coordination" > /dev/null
          sema resolve StateLock > /dev/null
          sema skeleton > /dev/null

      - name: Verify vocabulary workflow
        if: matrix.python-version == '3.12'
        run: python scripts/verify_vocabulary_change.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.11.12

      - name: Lint
        run: >-
          ruff check
          src/
          scripts/rebuild_vocabulary.py
          scripts/verify_vocabulary_change.py

      - name: Format check
        run: >-
          ruff format --check
          src/
          scripts/rebuild_vocabulary.py
          scripts/verify_vocabulary_change.py
